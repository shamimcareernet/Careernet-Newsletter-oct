<script>
    async function getStats() {
      const oAuthIntegrationGuid = "13ecc50141f241729811505e732a4555";
      const oAuthClientId = "ffc8f9d0-73ed-40d7-952d-b3b21dd136cd";
      const baseDomain = "https://mycareernet.co";

      async function getTokenData() {
        const cachedKey = window.btoa(`${window.location.pathname}_access_token`);
        try {
          const cached = JSON.parse(sessionStorage.getItem(cachedKey));
          if (!cached || (parseInt(new Date().getTime() / 1000) + 10 - cached.createdAt > cached.expires_in)) {
              throw new Error("Token expired");
          }
          return cached;
        } catch (e) {
          const res = await fetch(`${baseDomain}/py/oauth2/${oAuthIntegrationGuid}/access_token/`, {
            "headers": { "accept": "application/json", "app-name": "hackathon", "x-applma": "true" },
            "body": JSON.stringify({ "client_id": oAuthClientId }),
            "method": "POST"
          });
          const info = await res.json();
          if (info.access_token) {
            info['createdAt'] = parseInt(new Date().getTime() / 1000);
            sessionStorage.setItem(cachedKey, JSON.stringify(info));
            return info;
          }
          throw new Error("Token failed");
        }
      }

      try {
        const token = await getTokenData();
        const pathParts = window.location.pathname.split('/');
        let slug = pathParts.length > 2 ? pathParts.slice(2).join('') : ''; 
        
        if(!slug) throw new Error("No slug");

        const res = await fetch(`${baseDomain}/py/crpo/marketing_event/candidate/api/v1/getBySlug/`, {
          "headers": { "app-name": "hackathon", "authorization": `${token.token_type} ${token.access_token}`, "x-applma": "true" },
          "body": JSON.stringify({ "slug": slug }),
          "method": "POST"
        });
        
        const json = await res.json();
        const views = json?.data?.entitySummary?.currentCount?.toLocaleString() || "0";
        const regs = json?.data?.marketingEvent?.applicantSummary?.registered?.toLocaleString() || "0";

        document.getElementById("statsStrip").innerHTML = `
          <div class="he-stat-row"><i class="fa fa-regular fa-eye"></i> ${views} Views</div>
          <div class="he-stat-row"><i class="fa fa-solid fa-user-check"></i> ${regs} Registrations</div>
        `;
      } catch (error) {
        document.getElementById("statsStrip").innerHTML = `
          <div class="he-stat-row" style="color:var(--c-text-light); font-size:13px;">
            <i class="fa-solid fa-circle-exclamation"></i> Stats unavailable
          </div>
        `;
      }
    }
    getStats();

    /* --- DATE-BASED MODAL CONTROL LOGIC --- */
    document.addEventListener("DOMContentLoaded", function () {
        const glassModal = document.getElementById("straiveGlassModal");
        const closeGlassModalBtn = document.getElementById("straiveCloseModal");
        const registerLinks = document.querySelectorAll(".registrationLink");

        // Cutoff Date: aligned with "Registrations End" (Oct 5, 2026 23:59:59 IST) shown above,
        // instead of the old Aug 31, 2026 date which was already in the past and fired the
        // "event closed" popup on every visit.
      const closureDate = new Date("2026-10-06T19:00:00+05:30");
        const currentDate = new Date();

        const isEventClosed = currentDate >= closureDate;

        function openGlassModal(e) {
            if (e) e.preventDefault();
            if (glassModal) {
                glassModal.classList.add("active");
                document.body.style.overflow = 'hidden';
            }
        }

        function closeGlassModal() {
            if (glassModal) {
                glassModal.classList.remove("active");
                document.body.style.overflow = '';
            }
        }

        if (glassModal && closeGlassModalBtn) {
            // Close button handlers
            closeGlassModalBtn.addEventListener("click", closeGlassModal);
            glassModal.addEventListener("click", function (e) {
                if (e.target === glassModal) {
                    closeGlassModal();
                }
            });

            // Trigger popup ONLY once registrations have actually closed
            if (isEventClosed) {
                registerLinks.forEach(link => {
                    link.addEventListener("click", openGlassModal);
                });

                // Auto-show popup after 2s once event is officially closed
                setTimeout(function() {
                    openGlassModal();
                }, 2000);
            }
        }
    });
</script>
